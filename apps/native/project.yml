# XcodeGen spec — the .xcodeproj is generated from this file and gitignored.
# Regenerate after adding/moving source files:  cd apps/native && xcodegen
name: Leeft
options:
    bundleIdPrefix: app.web
    deploymentTarget:
        iOS: "17.0"
    createIntermediateGroups: true
    groupSortPosition: top

packages:
    Firebase:
        url: https://github.com/firebase/firebase-ios-sdk
        majorVersion: 11.0.0
    GoogleSignIn:
        url: https://github.com/google/GoogleSignIn-iOS
        majorVersion: 8.0.0

targets:
    Leeft:
        type: application
        platform: iOS
        sources:
            - path: Sources
            - path: Resources
              excludes:
                  - "Info.plist"
        dependencies:
            - package: Firebase
              product: FirebaseAuth
            - package: Firebase
              product: FirebaseFirestore
            - package: GoogleSignIn
              product: GoogleSignIn
            - package: GoogleSignIn
              product: GoogleSignInSwift
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: app.web.leeft
                PRODUCT_NAME: Leeft
                MARKETING_VERSION: "0.1.0"
                CURRENT_PROJECT_VERSION: "1"
                INFOPLIST_FILE: Resources/Info.plist
                # Portrait-only, matching the web manifest's orientation lock.
                TARGETED_DEVICE_FAMILY: "1"
                SWIFT_VERSION: "5.0"
                ENABLE_USER_SCRIPT_SANDBOXING: YES
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
                # Paid Developer Program team; keeps xcodegen from blanking signing on every regen.
                DEVELOPMENT_TEAM: "239DX635Y5"
                CODE_SIGN_STYLE: Automatic

schemes:
    Leeft:
        build:
            targets:
                Leeft: all
        run:
            config: Debug
        archive:
            config: Release
